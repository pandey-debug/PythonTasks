{% extends 'base.html' %}

{% block title %}CineBook - Premium Sign Up{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl relative">
        <div class="h-2.5 bg-red-600"></div>
        
        <div class="p-8 sm:p-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-red-500/10 border border-red-500/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="user-plus" class="w-6 h-6"></i>
                </div>
                <h1 class="font-display text-2xl font-bold text-white tracking-tight">Create Club Account</h1>
                <p class="text-zinc-400 text-sm mt-1">Unlock seamless booking and booking schedules</p>
            </div>

            <!-- Registration form -->
            <form id="register-form" class="space-y-5">
                <!-- Full Name Input -->
                <div>
                    <label for="reg-name" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Username / Alias</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input type="text" id="reg-name" name="name" required placeholder="e.g., JaneDoe" class="w-full bg-zinc-950 border border-zinc-850 focus:border-red-500 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-500 transition-all font-medium">
                    </div>
                </div>

                <!-- Phone number field -->
                <div>
                    <label for="reg-phone" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Phone Number</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <i data-lucide="phone" class="w-4 h-4"></i>
                        </div>
                        <input type="tel" id="reg-phone" name="phone" required placeholder="e.g., +1 (555) 019-2834" class="w-full bg-zinc-950 border border-zinc-850 focus:border-red-500 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-500 transition-all font-medium">
                    </div>
                </div>

                <!-- Role dropdown -->
                <div>
                    <label for="reg-role" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Account Role</label>
                    <select id="reg-role" name="role" class="w-full bg-zinc-950 border border-zinc-850 focus:border-red-500 rounded-xl px-3.5 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-500 transition-all font-semibold">
                        <option value="user" selected>Normal User (Patron)</option>
                        <option value="admin">Super Administrator (Control Panel)</option>
                    </select>
                </div>
                <!-- Password Input -->
                <div>
                    <label for="reg-password" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="reg-password" name="password" required placeholder="Create a strong password" class="w-full bg-zinc-950 border border-zinc-850 focus:border-red-500 rounded-xl pl-10 pr-10 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-500 transition-all font-medium">
                        <button type="button" id="toggle-reg-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-500 hover:text-zinc-300 transition-colors">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div>
                    <label for="reg-confirm-password" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="reg-confirm-password" name="confirm_password" required placeholder="Re-enter your password" class="w-full bg-zinc-950 border border-zinc-850 focus:border-red-500 rounded-xl pl-10 pr-10 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-500 transition-all font-medium">
                        <button type="button" id="toggle-reg-confirm-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-500 hover:text-zinc-300 transition-colors">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Live alert box -->
                <div id="alert-box" class="hidden p-4 rounded-xl text-xs font-medium border"></div>

                <!-- Submit Button -->
                <button type="submit" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-500 active:scale-[0.98] text-white font-bold text-sm py-3.5 rounded-xl transition-all shadow-lg hover:shadow-red-600/25">
                    <span>Create Free Account</span>
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Bottom redirection to Login -->
            <div class="mt-8 pt-6 border-t border-zinc-850 text-center text-sm text-zinc-400">
                Already registered in our club? 
                <a href="{{ url_for('login') }}" class="text-red-400 hover:text-red-300 font-semibold transition-colors">Sign In Here</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('register-form');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.className = 'hidden';

            const nameVal     = document.getElementById('reg-name').value.trim();
            const phoneVal    = document.getElementById('reg-phone').value.trim();
            const roleVal     = document.getElementById('reg-role').value;
            const passwordVal = document.getElementById('reg-password').value.trim();
            const confirmVal  = document.getElementById('reg-confirm-password').value.trim();

            // Frontend validation
            if (!nameVal || !phoneVal || !passwordVal) return;

            if (passwordVal !== confirmVal) {
                alertBox.className = 'p-4 rounded-xl text-xs font-semibold border bg-red-500/10 text-red-400 border-red-500/20';
                alertBox.innerText = 'Passwords do not match.';
                alertBox.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name:     nameVal,
                        phone:    phoneVal,
                        role:     roleVal,
                        password: passwordVal   // ← was missing
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alertBox.className = 'p-4 rounded-xl text-xs font-semibold border bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                    alertBox.innerText = result.message || 'Registration successful!';
                    alertBox.classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = result.redirect || "{{ url_for('index') }}";
                    }, 1000);
                } else {
                    alertBox.className = 'p-4 rounded-xl text-xs font-semibold border bg-red-500/10 text-red-400 border-red-500/20';
                    alertBox.innerText = result.message || 'Registration failed. Try a different username.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = 'p-4 rounded-xl text-xs font-semibold border bg-red-500/10 text-red-400 border-red-500/20';
                alertBox.innerText = 'Network error during registration. Try again.';
                alertBox.classList.remove('hidden');
            }
        });
    });
</script>
<script>
    function setupPasswordToggle(btnId, inputId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        btn.addEventListener('click', () => {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.querySelector('i').setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });
    }

    setupPasswordToggle('toggle-reg-password', 'reg-password');
    setupPasswordToggle('toggle-reg-confirm-password', 'reg-confirm-password');
</script>

{% endblock %}
