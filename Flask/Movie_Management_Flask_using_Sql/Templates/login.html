{% extends 'base.html' %}

{% block title %}CineBook - Premium Sign In{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl relative">
        <div class="h-2.5 bg-red-600"></div>
        
        <div class="p-8 sm:p-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-red-500/10 border border-red-500/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="user-check" class="w-6 h-6"></i>
                </div>
                <h1 class="font-display text-2xl font-bold text-white tracking-tight">Access Your Tickets</h1>
                <p class="text-zinc-400 text-sm mt-1">Enter your registration username to authenticate</p>
            </div>

            <!-- Login form -->
            <form id="login-form" class="space-y-6">
                <!-- Username Input -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input type="text" id="username" name="name" required placeholder="e.g., JohnDoe" class="w-full bg-zinc-950 border border-zinc-850 focus:border-red-500 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-500 transition-all font-medium">
                    </div>
                </div>
                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="password" name="password" required placeholder="Enter your password" class="w-full bg-zinc-950 border border-zinc-850 focus:border-red-500 rounded-xl pl-10 pr-10 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-500 transition-all font-medium">
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-500 hover:text-zinc-300 transition-colors">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <!-- Live alert box -->
                <div id="alert-box" class="hidden p-4 rounded-xl text-xs font-medium border"></div>

                <!-- Submit Button -->
                <button type="submit" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-500 active:scale-[0.98] text-white font-bold text-sm py-3.5 rounded-xl transition-all shadow-lg hover:shadow-red-600/25">
                    <span>Sign In to Account</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Bottom redirection to Register -->
            <div class="mt-8 pt-6 border-t border-zinc-850 text-center text-sm text-zinc-400">
                Don't have an account yet? 
                <a href="{{ url_for('register') }}" class="text-red-400 hover:text-red-300 font-semibold transition-colors">Sign Up Here</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.className = 'hidden';

            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value.trim();

            if (!usernameVal || !passwordVal) return;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: usernameVal, password: passwordVal })  // ← password added
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alertBox.className = 'p-4 rounded-xl text-xs font-semibold border bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                    alertBox.innerText = result.message || 'Login successful!';
                    alertBox.classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = result.redirect || "{{ url_for('index') }}";  // ← role-based redirect
                    }, 1000);
                } else {
                    alertBox.className = 'p-4 rounded-xl text-xs font-semibold border bg-red-500/10 text-red-400 border-red-500/20';
                    alertBox.innerText = result.message || 'Invalid username or password.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = 'p-4 rounded-xl text-xs font-semibold border bg-red-500/10 text-red-400 border-red-500/20';
                alertBox.innerText = 'Network error during authentication. Try again.';
                alertBox.classList.remove('hidden');
            }
        });

        // Password toggle
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.querySelector('i').setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });
    });
</script>
{% endblock %}
